name: CI

# M0 S7 / AC-8：三平台矩阵。
# 这里的断言失败**不许改断言迁就文档** —— 按 PRD 5.3.2 与 S7 的约定，
# 不符时改 docs/PRD.md 第 8 节并同步 D27。
#
# 排查提示：作业日志端点即便对公开仓也要求管理员权限（实测 403），匿名 REST 只有
# 60 次/小时。所以每个可能失败的步骤都把输出 tee 到 ./*.log，最后由
# scripts/ci-publish-status.mjs 汇总成 ci-diagnosis/<os>.md 提交到同名分支 ——
# 那份文件可以从 raw.githubusercontent.com 直接读，成功失败都写。
# 为此本流水线需要 contents: write（只写 ci-diagnosis 分支，不碰 main）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
        # 两条引擎线各跑一遍：22 是本工具声明的最低线（实测有 flagless node:sqlite），
        # 24 是原先的唯一线。两条线都跑，才谈得上"支持"而不是"看起来支持"。
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装依赖（干净锁文件）
        run: npm ci

      # 拆成四个独立步骤，是为了让"哪一阶段红"能从步骤结论里读出来 ——
      # 合成一步时只能看到 failure，拿不到日志。

      - name: 构建
        run: npm run build

      - name: 类型检查
        run: npm run typecheck

      - name: Lint（门禁 A 的 eslint 层）
        run: npm run lint

      - name: 测试（门禁 A/B/C 的权威层 + M1 契约）
        shell: bash
        run: set -o pipefail && npm test 2>&1 | tee .test.log

      - name: env-paths 三平台落点实测并断言（AC-8 / 闭合 O13）
        if: ${{ !cancelled() }}
        shell: bash
        run: set -o pipefail && npm run ci:paths 2>&1 | tee .paths.log

      - name: 全局安装冒烟：无编译工具链（AC-8 后半）
        if: ${{ !cancelled() }}
        shell: bash
        run: set -o pipefail && npm run ci:global 2>&1 | tee .global.log

      - name: 把结论发布到 ci-diagnosis 分支（raw 可直读，不占 API 配额）
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          # 矩阵加了 node 轴后，同一 OS 会有两个 job 落同一个文件名而互相覆盖，
          # 所以把 node 主版本一并带过去，由脚本拼进路径与标题。
          NODE_MAJOR: ${{ matrix.node }}
        run: node scripts/ci-publish-status.mjs

  # 名字刻意写清：这条 job 验证的是"**拒绝方式合规**"，不是"能跑"。
  # 别把它读成"支持 Node 20"。
  runtime-refusal:
    name: 运行时下限外的拒绝方式合规（不是支持 Node 20）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 低于 engines 下限（>=22.22.0 <23 || >=23.4.0）的版本：20 完全没有 node:sqlite
          node-version: '20'
          cache: npm

      # 只跑 build —— 不跑 npm ci / npm run verify：低版本上 devDependencies 未必装得上，
      # 而本 job 要证的只是"我们拒绝得合规"，不是"我们在 20 上可用"。
      - name: 安装运行时依赖并构建
        run: npm install --omit=dev --no-save && npx --yes tsup

      - name: 断言：单行 JSON + RUNTIME_UNSUPPORTED + 退出 3 + 无堆栈
        shell: bash
        run: |
          set -o pipefail
          set +e
          stderr=$(node dist/index.js describe 2>&1 >/dev/null)
          code=$?
          set -e
          printf '%s\n' "$stderr" > .refusal.log
          echo "退出码: $code"
          echo "stderr:"
          printf '%s\n' "$stderr"

          if [ "$code" != "3" ]; then echo "::error::退出码应为 3，实为 $code"; exit 1; fi
          if [ "$(printf '%s\n' "$stderr" | wc -l)" != "1" ]; then
            echo "::error::stderr 必须是单行 JSON（5.2.1）；修复前这里是 Node 的多行堆栈"; exit 1
          fi
          node -e '
            const p = JSON.parse(require("fs").readFileSync(".refusal.log", "utf8"));
            if (p.code !== "RUNTIME_UNSUPPORTED") { console.error("::error::code 应为 RUNTIME_UNSUPPORTED，实为 " + p.code); process.exit(1); }
            if (!p.node || !p.requires) { console.error("::error::错误对象须带 node 与 requires 字段"); process.exit(1); }
            console.log("OK 拒绝方式合规：单行 JSON + RUNTIME_UNSUPPORTED + node/requires 字段齐备");
          '
          # stdout 必须为空（数据体不得混入错误路径）
          if [ -n "$(node dist/index.js describe 2>/dev/null)" ]; then
            echo "::error::stdout 应为空"; exit 1
          fi
